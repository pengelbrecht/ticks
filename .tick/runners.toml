# How ticfac runs this repository's epics. ticks does not read this file; its
# schema and semantics are ticfac's (github.com/pengelbrecht/ticfac).
version = 2

[orchestrator]
harness = "claude"
model = "workers-ai/@cf/deepseek-ai/deepseek-v4-pro-0813"

# `auto`, not a `herdr` pin. A pin asserts "herdr is reachable for every run of
# this repository", and this repository is driven three ways: a local harness in
# herdr panes, a local harness with no herdr running (the skill's original mode,
# subagents), and a cloud sandbox that has no herdr server. `auto` probes and
# resolves all three correctly. The pin made the second announce a broken
# assertion every run and made the third stop outright — which is how the first
# cloud run of this repo to complete a real agent turn ended.
[orchestration]
substrate = "auto"
max_parallel = 6

[roles.implement]
kind = "claude"
model = "sonnet"
effort = "high"

[roles.implement.tiers.economy]
model = "haiku"
effort = "low"

[roles.implement.tiers.strong]
model = "opus"
effort = "high"

# Cross-vendor variant (production experiment, human-approved): the balanced
# tier routes to a codex implementer. Tier names are the closed schema enum,
# so the vendor switch rides an existing tier name.
[roles.implement.tiers.balanced]
kind = "codex"
model = "gpt-5.6-luna"
effort = "max"

[testing]
notes = "UI hint: when UI source changes, run pnpm install --frozen-lockfile, pnpm typecheck and pnpm test in internal/tickboard/ui, then scripts/build-ui.sh."

[testing.commands]
go = { command = "go test -short -count=1 ./...", description = "Go" }
ui = { command = "cd internal/tickboard/ui && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test", description = "Local board UI" }

[environment.commands]
which-go = { command = "which go", description = "Go toolchain on PATH" }
which-pnpm = { command = "which pnpm", description = "pnpm on PATH (never npm/yarn in this repo)" }
git-config-user-email = { command = "git config user.email", description = "git identity configured" }

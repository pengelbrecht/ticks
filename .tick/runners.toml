# Worker routing for herd-substrate epic runs. Schema:
# skills/ticks/references/runners-config.schema.json; semantics: runners-config.md.
version = 1

[orchestrator]
harness = "claude"

[orchestration]
substrate = "herdr"
max_parallel = 3

[roles.implement]
kind = "claude"
model = "sonnet"
effort = "high"

[roles.implement.tiers.economy]
model = "haiku"
effort = "low"

[roles.implement.tiers.strong]
model = "opus"
effort = "high"

# Cross-vendor variant (production experiment, human-approved): the balanced
# tier routes to a codex implementer. Tier names are the closed schema enum,
# so the vendor switch rides an existing tier name.
[roles.implement.tiers.balanced]
kind = "codex"
model = "gpt-5.6-luna"
effort = "high"

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Guard tracked files
        run: node scripts/check-public-repo.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format
        # gofmt -l prints any file that needs formatting; fail the job on a
        # non-empty list so gofmt coverage cannot drift. ./... reaches every
        # package in the module, including scripts/experiments.
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Build
        run: go build ./...

      # The Go half of the cross-language contract bundle, named so that a
      # contract failure is legible in the CI log instead of being one line in
      # a full-suite run. This step is the reason a deliberate fixture break
      # fails a build: internal/contracts re-hashes contracts/ against the
      # version cloud/factory pins, and every *_parity_test.go below executes
      # the behavioural fixtures themselves. The TypeScript half runs in the
      # `factory` and `ticks-runner` jobs against the SAME files — that is the
      # whole mechanism (contracts/README.md).
      - name: Contract bundle and parity fixtures
        run: |
          go test -short \
            ./internal/contracts/... \
            ./internal/herd/config/... \
            ./internal/herd/collect/... \
            ./internal/cloud/collect/... \
            ./internal/sandbox/... \
            ./internal/operator/... \
            ./internal/tick/...

      - name: Test
        # -short skips live-API/CLI integration tests (internal/agent), which
        # also self-skip when the claude CLI is absent.
        run: go test -short ./...

  ui:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: internal/tickboard/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in the nested UI package.json, not the repo root
          package_json_file: internal/tickboard/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/tickboard/ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Which parts of the tree changed. Only the sandbox job needs this today: an
  # image build is minutes and gigabytes, so unrelated PRs must not pay for one.
  changes:
    runs-on: ubuntu-latest
    # The filter reads the pull request's file list through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sandbox:
              - 'cloud/sandbox/**'
              - '.github/workflows/ci.yml'

  # The orchestrator sandbox image. Build only, never push: the operator pushes
  # it into their own registry at `tk factory deploy` cadence (D16). This job
  # exists because "the image builds" is the one thing the Go tests cannot
  # prove — they check pin discipline and run the scripts, not docker.
  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the orchestrator sandbox image
        # The same script the operator runs, so the build path is the one that
        # is exercised. It tags with the tk version the Dockerfile pins.
        #
        # --tk-ref is REQUIRED here. The Dockerfile's default TK_SOURCE_REF is
        # the last release tag, and its final layer runs every entry in
        # required-tk-commands against the tk it just built — so any PR that
        # adds a subcommand the entrypoint needs cannot build against a release
        # that predates it, and this job would fail until the next release cut.
        # Pinning the commit under test is also what `tk factory deploy` does.
        # The commit must be PUSHED — `go install` inside the image resolves it
        # through the module proxy, which fetches public commits on demand.
        run: cloud/sandbox/build.sh --tk-ref "$TK_REF"
        env:
          TK_REF: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report the image
        run: docker image ls ticks-orchestrator

  worker:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in the nested UI package.json, not the repo root
          package_json_file: internal/tickboard/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/worker/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  ticks-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test
        run: node --test --no-warnings extensions/ticks-runner/*.test.ts

  factory:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: cloud/factory
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in the nested UI package.json, not the repo root
          package_json_file: internal/tickboard/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/factory/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The factory's vitest suite imports the cross-language contracts from
      # the repository root. This asserts, offline, that every contract a test
      # imports is pinned in contracts.pin.json and present — and, once the
      # factory is extracted and the pin flips to "pinned" mode, that the
      # vendored copy still hashes to what ticks published.
      #
      # A separate step so a contracts problem is named as one in the CI log
      # rather than surfacing as a module-resolution error inside vitest.
      # `pnpm test` and `pnpm typecheck` chain the same check, so this cannot
      # be the only place it runs.
      - name: Verify the contracts pin
        run: pnpm contracts:check

      # The negative controls: each deliberately breaks the bundle in a
      # throwaway copy and asserts the check refuses it. Mirrors
      # internal/contracts/bundle_test.go. Without these, `contracts:check`
      # passing proves only that it ran — not that it can fail.
      #
      # Plain `node --test`, not vitest: the factory suite executes inside
      # workerd, which has no filesystem to build a broken bundle in.
      - name: Prove the contracts check fails on a broken bundle
        run: pnpm contracts:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Guard tracked files
        run: node scripts/check-public-repo.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format
        # gofmt -l prints any file that needs formatting; fail the job on a
        # non-empty list so gofmt coverage cannot drift.
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Build
        run: go build ./...

      # The contract bundle (contracts/: tk-json-manifest and tracker-layout,
      # the formats ticks owns), named so that a contract failure is legible in
      # the CI log instead of being one line in a full-suite run. Consumers
      # (ticfac) pin the bundle and check the pin in their own CI.
      #
      # Every Go package with a reader of contracts/ belongs in this list. A
      # reader missing from it still runs in the full `Test` step below, but
      # its failure stops being legible, which is the only thing this step buys.
      - name: Contract bundle and parity fixtures
        run: |
          go test -short \
            ./internal/tkcontract/... \
            ./internal/tick/... \
            ./cmd/tk/cmd/...

      - name: Test
        run: go test -short ./...

  ui:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: internal/tickboard/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in the nested UI package.json, not the repo root
          package_json_file: internal/tickboard/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/tickboard/ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

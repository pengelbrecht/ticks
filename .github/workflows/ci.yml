name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Guard tracked files
        run: node scripts/check-public-repo.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # -short skips live-API/CLI integration tests (internal/agent), which
        # also self-skip when the claude CLI is absent.
        run: go test -short ./...

  ui:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: internal/tickboard/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in the nested UI package.json, not the repo root
          package_json_file: internal/tickboard/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/tickboard/ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

  # Which parts of the tree changed. Only the sandbox job needs this today: an
  # image build is minutes and gigabytes, so unrelated PRs must not pay for one.
  changes:
    runs-on: ubuntu-latest
    # The filter reads the pull request's file list through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sandbox:
              - 'cloud/sandbox/**'
              - '.github/workflows/ci.yml'

  # The orchestrator sandbox image. Build only, never push: the operator pushes
  # it into their own registry at `tk factory deploy` cadence (D16). This job
  # exists because "the image builds" is the one thing the Go tests cannot
  # prove — they check pin discipline and run the scripts, not docker.
  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the orchestrator sandbox image
        # The same script the operator runs, so the build path is the one that
        # is exercised. It tags with the tk version the Dockerfile pins.
        run: cloud/sandbox/build.sh

      - name: Report the image
        run: docker image ls ticks-orchestrator

  worker:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in the nested UI package.json, not the repo root
          package_json_file: internal/tickboard/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/worker/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

  ticks-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test
        run: node --test --no-warnings extensions/ticks-runner/*.test.ts

  factory:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: cloud/factory
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in the nested UI package.json, not the repo root
          package_json_file: internal/tickboard/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/factory/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
